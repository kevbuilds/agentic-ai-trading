[project]
name = "agentic-ai-trading"
version = "1.0.0"
description = "Autonomous AI Trading Simulation with 4 AI traders powered by OpenAI Agents SDK and MCP servers"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Kevin", email = "kevin@example.com" }
]
license = { text = "MIT" }
keywords = ["ai", "trading", "agents", "mcp", "openai", "simulation"]

dependencies = [
    "anthropic>=0.49.0",
    "gradio>=5.22.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.5.0",
    "mcp-server-fetch>=2025.1.17",
    "openai>=1.68.2",
    "openai-agents>=0.0.15",
    "plotly>=6.0.1",
    "polygon-api-client>=1.14.5",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
]

[project.urls]
Homepage = "https://github.com/kevbuilds/agentic-ai-trading"
Repository = "https://github.com/kevbuilds/agentic-ai-trading"
Documentation = "https://github.com/kevbuilds/agentic-ai-trading#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "ipykernel>=6.29.5",
    "jupyter>=1.0.0",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

